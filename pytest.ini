[pytest]
# The tests live in tests/. The project's code lives in src/safeshelf, and the shared
# test helpers in tests/helpers.py, so both folders go on the Python path.
testpaths = tests
pythonpath = src tests

# --strict-markers: a typo in @pytest.mark.<name> is an error instead of being ignored.
addopts = --strict-markers

markers =
    unit: a fast test of one small piece, such as a function, a rule or a SQL constraint
    acceptance: one acceptance criterion from a GitHub issue, tested from the user's side
    e2e: runs the real commands the way a user would (slower)
    issue(number): the GitHub issue the test belongs to (run them with --issue NUMBER)
